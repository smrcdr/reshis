services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reshis
      POSTGRES_PASSWORD: reshis
      POSTGRES_DB: reshis
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reshis -d reshis']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
